name: Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# main 上的发布不要并行，也不要取消已经开始的发布。
# pull request 上的检查可以取消过期的一次。
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # PR 检查拆成并行的小 job，再按分片跑测试：整条关键路径从约 10 分钟降到几分钟，
  # 改坏一个文件的等待时间不再和改坏十个文件一样长。
  setup-checks:
    name: Lint and package checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check CLI catalog release
        run: node ./scripts/check-cli-catalog-release.mjs "origin/${GITHUB_BASE_REF}" HEAD

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package checks
        run: pnpm check:packages

      - name: Lint
        run: pnpm lint

  scope:
    name: Test scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      paths: ${{ steps.scope.outputs.paths }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 只改一个组件时不必跑全仓库。判断逻辑在 scripts/affected-checks.mjs：
      # 改到配置、脚本、锁文件这类共享文件就退回全量。
      - name: Decide what to test
        id: scope
        run: |
          set -eu
          eval "$(node ./scripts/affected-checks.mjs "origin/${GITHUB_BASE_REF}")"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "paths=${paths}" >> "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test ${{ matrix.shard }}/${{ matrix.shards }}
    needs: scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        shards: [5]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          set -eu
          mode="${{ needs.scope.outputs.mode }}"
          paths="${{ needs.scope.outputs.paths }}"
          if [ "${mode}" = "all" ]; then
            pnpm exec vitest run --shard=${{ matrix.shard }}/${{ matrix.shards }}
          elif [ "${{ matrix.shard }}" = "1" ]; then
            # 窄范围只跑相关目录，外加 tests/ 里那些守卫检查（目录、发布、文案）。
            pnpm exec vitest run ${paths} tests
          else
            echo "改动范围窄，这一片不需要跑。"
          fi

  build:
    name: Build and pack
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Lint published output
        run: pnpm lint:pkg

      # 演练场页面在仓库里能过类型检查，不代表 CLI 复制到用户项目后也能过：
      # 用户项目看不到演练场的 tsconfig 别名。这里把 isReady 的模板落到一个临时项目，
      # 只用 vue 和 @astryx-vue/core 的包导出再检查一遍（约 15 秒）。
      - name: Check templates land cleanly
        run: pnpm check:templates

      - name: Dry-run pack
        run: pnpm release:dry-run

  # 本机从生产模式的进程里起 shell 时，子进程会继承 NODE_ENV=production。
  # vitest.config.ts 会先把它改成 test，再加载 Vue 插件，测试才和 CI 一致。
  # tests/test-env.test.ts 专门检查这件事，而且只有外部真的带了 NODE_ENV=production 才有意义。
  # 整套测试已经在上面的 pnpm check 里跑过，这里只跑这一个文件。
  test-under-production-env:
    name: Test env under production shell
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the env guard
        run: NODE_ENV=production pnpm exec vitest run tests/test-env.test.ts

  release:
    name: Version or publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use npm 11.5 or newer
        run: |
          npm install -g npm@^11.5.1
          version="$(npm -v)"
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) { console.error(`npm ${process.argv[1]} 低于 11.5`); process.exit(1) } console.log(`npm ${process.argv[1]}`)' "$version"

      # 完整测试已经在 PR 上并行跑过；main 上只做构建前必须过的检查，
      # 避免每次发版都先等十分钟。构建本身在 pnpm release 里做。
      - name: Check
        run: pnpm check:packages && pnpm lint && pnpm typecheck

      - name: Check npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -n "${NPM_TOKEN}" ]; then
            echo "检测到备用的 NPM_TOKEN。pnpm 会先尝试 GitHub OIDC；Trusted Publisher 换票失败时才退回这个 token。不建议依赖它。"
            touch "${HOME}/.npmrc"
            if ! grep -q '//registry.npmjs.org/:_authToken=' "${HOME}/.npmrc"; then
              printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "${HOME}/.npmrc"
            fi
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "没有 NPM_TOKEN。这次发布使用 GitHub OIDC。每个包都要在 npmjs.com 上配好 Trusted Publisher。"
          else
            echo "::error::没有可用的 npm 认证。首次发布请在自己的电脑上用 2FA 手动发出 0.1.0，然后配置 Trusted Publisher。NPM_TOKEN 只是不推荐的备用。详见 RELEASING.md。"
            exit 1
          fi

      # 有未消费的 changeset 就直接在这里改版本号，不再开 "Version Packages" PR。
      # 那个 PR 由机器人创建，每次都要人工批准整条 workflow，等待比构建还久。
      - name: Apply pending changesets
        id: apply
        env:
          # `changeset version` 用 changelog-github 生成条目，没有 token 会直接退出。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          shopt -s nullglob
          files=(.changeset/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm version-packages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version Packages"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      # 先把版本提交推回 main，再发布：发布中途出错时，下一次运行没有 changeset 了，
      # 会直接补发这几个版本，不需要人再点一次批准。
      - name: Push the version commit
        if: steps.apply.outputs.applied == 'true'
        run: git push origin HEAD:main

      - name: Version packages or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm version-packages
          commit-message: Version Packages
          pr-title: Version Packages
          create-github-releases: true
          push-git-tags: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' && 'true' || 'false' }}

      - name: Verify npm and link GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: node ./scripts/after-publish.mjs

      # 版本已在 npm（例如首发手动发布）时 changeset publish 什么都不做，也不会打 tag。
      # 这里补齐缺的 tag 和 GitHub Release，再用 after-publish.mjs 核对 npm 并补 npm 链接。
      - name: Backfill tags and GitHub Releases
        id: backfill
        if: steps.changesets.outputs.published != 'true' && steps.changesets.outputs.hasChangesets != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node ./scripts/backfill-releases.mjs

      - name: Verify npm and link backfilled Releases
        if: steps.backfill.outputs.packages != '' && steps.backfill.outputs.packages != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.backfill.outputs.packages }}
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          # 补齐的版本不是这个 workflow 发的（例如首发在本机手动发布），不会带 provenance。
          REQUIRE_PROVENANCE: 'false'
        run: node ./scripts/after-publish.mjs

  github-packages:
    name: GitHub Packages
    needs: release
    # npm 发布成功之后再双发。仓库变量 PUBLISH_GITHUB_PACKAGES=false 时关掉。
    # 这个 job 失败不会撤回已经发到 npm 的版本。
    if: needs.release.result == 'success' && vars.PUBLISH_GITHUB_PACKAGES != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          owner="${GITHUB_REPOSITORY_OWNER}"
          if [ "${owner}" != "astryx-vue" ]; then
            echo "::error::GitHub Packages 的 npm scope 必须等于仓库所有者。当前包是 @astryx-vue/*，仓库所有者是 ${owner}。这次不会上传。"
            exit 1
          fi
          touch "${HOME}/.npmrc"
          printf '%s\n' '@astryx-vue:registry=https://npm.pkg.github.com' "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "${HOME}/.npmrc"
          # packages/ 下每个不是 private 的包都发，新增包不用改这里。
          for dir in $(node ./scripts/list-public-packages.mjs); do
            name="$(node -p "require('./packages/${dir}/package.json').name")"
            version="$(node -p "require('./packages/${dir}/package.json').version")"
            # 上面已把 @astryx-vue scope 指向 GitHub Packages，scope 配置优先于 --registry，
            # 所以这里必须同时覆盖 scope registry，才真的是在查 npmjs.org。
            if ! npm view "${name}@${version}" version --registry https://registry.npmjs.org --@astryx-vue:registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${name}@${version} 还没发布到 npmjs.org，跳过 GitHub Packages。"
              continue
            fi
            if npm view "${name}@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "${name}@${version} 已经在 GitHub Packages，跳过。"
              continue
            fi
            pnpm --filter "${name}" publish --registry https://npm.pkg.github.com --no-git-checks --no-provenance
          done

  # 只在 changesets 真的 publish 之后跑。核对 npm、补 Release 这些后续步骤失败时，
  # published 已经是 true；重跑往往不会再发布一次，所以不能等整个 release job 成功。
  # 取消的运行不同步。这个 job 失败不会撤回已经发出的版本。
  sync-main-to-dev:
    name: Sync main into dev
    needs: release
    if: always() && cancelled() == false && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/sync-main-into-dev.sh
