name: Deploy Docs to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    # 只有会影响文档产物的文件变动才触发，省下 Pages 每月 500 次的构建额度
    paths: &docs-paths
      - 'apps/docs/**'
      - 'packages/**'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docs.yml
  pull_request:
    # 不写 types 时默认就是 opened / synchronize / reopened。
    # synchronize 表示「PR 分支又推了新 commit」，这正是每次提交都部署的来源。
    # 想进一步省额度：改成 [opened, reopened, synchronize, labeled]，
    # 并在下面 Deploy 步骤的 if 里追加 label 判断（见该步骤注释）。
    paths: *docs-paths

# 同一个 PR（或同一分支）只保留最新一次运行，旧的在途运行直接取消，
# 避免连续推送时每一次 commit 都吃掉一次构建额度。
# main 不取消，防止生产部署被掐断在半路。
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 在 commit message 或 PR 标题的「开头」写 [skip deploy] 才跳过本次部署。
    # 这里必须用 startsWith 而不是 contains：squash 合并会把 PR 正文并进 commit
    # message，只要正文里提到过这个字符串，contains 就会把整次部署误跳过。
    if: |
      !startsWith(github.event.head_commit.message, '[skip deploy]') &&
      !startsWith(github.event.pull_request.title, '[skip deploy]')
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: pnpm

      # esbuild / workerd 的构建许可已在 pnpm-workspace.yaml 的 allowBuilds 里声明，
      # 这里一条命令装完即可，不需要再走 approve-builds 回头重装。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter @astryx-vue/core build

      - name: Build docs
        run: pnpm docs:build

      - name: Deploy to Cloudflare Pages
        # 满足任一即部署：
        #   - push 事件（main / dev）
        #   - 自有仓库的 PR（fork PR 拿不到 secrets）
        # 且 PR 的 head 分支不能是 main / dev，否则 push 事件已经部署过，会重复扣额度。
        # 想启用 label 门控时，在最后一个右括号前追加：
        #   && contains(github.event.pull_request.labels.*.name, 'docs-preview')
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.ref != 'main' &&
           github.event.pull_request.head.ref != 'dev')
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          DEPLOY_OUTPUT=$(pnpm exec wrangler pages deploy apps/docs/.vitepress/dist --project-name=astryx-vue --branch="$BRANCH" 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOYMENT_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^[:space:]]+\.pages\.dev' | head -1)
          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL
        # 用一个固定的 Markdown 注释当标记：找到旧评论就原地更新，
        # 不再每次部署都往 PR 里刷一条新评论。
        # head 是 dev 的 PR（dev → main）不会重复部署，预览就是 dev 分支的固定地址，
        # 该地址由 dev 的 push 事件部署，所以这里只贴链接。
        if: |
          github.event_name == 'pull_request' &&
          (steps.deploy.outcome == 'success' || github.event.pull_request.head.ref == 'dev')
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ github.event.pull_request.head.ref == 'dev' && 'https://dev.astryx-vue.pages.dev' || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cf-pages-preview -->'
            const url = process.env.PREVIEW_URL || 'https://astryx-vue.pages.dev'
            const body = [marker, '📚 **文档预览已更新**', '', `🔗 ${url}`].join('\n')

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find(c => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              })
              core.info(`Updated existing preview comment #${existing.id}`)
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              })
              core.info('Created new preview comment')
            }

      - name: Deploy skipped
        if: steps.deploy.outcome == 'skipped'
        run: |
          echo "⚠️  本次未部署，原因之一："
          echo "   - 这是 fork PR，拿不到 Cloudflare secrets"
          echo "   - PR 的 head 分支是 main/dev，push 事件已经部署过了"
          echo "   - PR 没有 docs-preview 标签（启用 label 门控时）"
          echo "📦 文档已成功构建，产物在 apps/docs/.vitepress/dist"
