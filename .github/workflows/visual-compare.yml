name: Visual Compare

# PR 改到组件时，对被改到的组件跑「上游 vs 我们」的视觉对照，把对照图作为附件上传，
# 在 PR 里留一条评论列出分数。只报告，不拦截：我们和上游目前本来就有不少差距，
# 分数高不会让 CI 变红。只有对照工具本身崩溃时这个 job 才失败。
on:
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/themes/**'
      - 'apps/docs/components/demos/**'
  workflow_dispatch:
    inputs:
      components:
        description: 要对照的组件，逗号分隔，上游英文名或我们的 slug 都行（例如 Button,dropdown-menu）。一次最多 8 个。
        required: true
        type: string

# 同一个 PR 只保留最新一次运行，连续推送时旧的直接取消。
# 手动运行之间互不取消，所以用 run_id 单独成组。
concurrency:
  group: visual-compare-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    name: Compare with upstream
    runs-on: ubuntu-latest
    # 最多 8 个组件、每个 4 种组合，再加装依赖和构建，留足余量。
    timeout-minutes: 45
    env:
      VISUAL_OUT: visual-out
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 要用 base...head 算出这个 PR 自己改了哪些文件，所以需要完整历史。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先算组件，没有组件就不用装浏览器、不用构建，后面的重活全部跳过。
      # 手动输入的组件名经 env 传进来，不直接拼进脚本，免得被当成 shell 代码执行。
      - name: Find changed components
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_COMPONENTS: ${{ inputs.components }}
        run: |
          mkdir -p "$VISUAL_OUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/swarm/changed-components.mjs --components "$MANUAL_COMPONENTS" --out "$VISUAL_OUT/plan.json" --github-output
          else
            node scripts/swarm/changed-components.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --out "$VISUAL_OUT/plan.json" --github-output
          fi

      # 浏览器版本跟着 lock 文件里的 playwright 走：缓存键里带上版本号，升级后自动换一份。
      - name: Read Playwright version
        id: playwright
        if: steps.plan.outputs.count > 0
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.plan.outputs.count > 0
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      # 对照工具用无头模式，只需要 chromium-headless-shell，比完整 Chromium 小得多。
      # 缓存命中时浏览器文件已经在了，但系统依赖（字体、图形库）不在缓存里，仍要单独装。
      - name: Install Playwright Chromium
        if: steps.plan.outputs.count > 0 && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.plan.outputs.count > 0 && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build packages
        if: steps.plan.outputs.count > 0
        run: pnpm build:packages

      # visual-ci.mjs 先预检两边页面是否存在（不存在的组件直接跳过，不开浏览器），
      # 再起一次文档站给所有组件共用，逐个调用 pnpm visual 的同一个脚本。
      # GitHub 的机器能直连上游，所以不走代理。
      # 它只在对照工具崩溃时返回非 0；组件跳过、组合截图失败都只写进报告。
      - name: Run visual compare
        id: run
        if: steps.plan.outputs.count > 0
        run: node scripts/swarm/visual-ci.mjs --plan "$VISUAL_OUT/plan.json" --out "$VISUAL_OUT" --no-proxy

      # 下面几步在上一步失败时也要跑：工具崩溃时，已经跑完的组件照样上传、照样报告。
      - name: Upload screenshots
        id: upload
        if: ${{ !cancelled() && steps.plan.outputs.count > 0 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-compare-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
          path: ${{ env.VISUAL_OUT }}
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      # 评论的 Markdown 由 visual-comment.mjs 生成（有单元测试），这里不拼字符串。
      # 同一份内容也写进运行摘要，手动运行和拿不到评论权限的 PR 都能在 Actions 页面看到。
      - name: Build comment
        id: comment
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f "$VISUAL_OUT/summary.json" ]; then
            input=(--summary "$VISUAL_OUT/summary.json")
          else
            input=(--plan "$VISUAL_OUT/plan.json")
          fi
          node scripts/swarm/visual-comment.mjs "${input[@]}" --artifact-url "$ARTIFACT_URL" --run-url "$RUN_URL" --out comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # fork 来的 PR（还有 Dependabot 的 PR）拿到的 GITHUB_TOKEN 是只读的，写评论会 403。
      # fork 的情况在 if 里直接跳过；其余写不进去的情况在脚本里降级成警告，不让 job 变红。
      # 没有要跑的组件时只更新已有的旧评论，不新发，免得没改组件的 PR 也收到一条评论。
      - name: Comment on PR
        if: |
          !cancelled() && steps.comment.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HAS_COMPONENTS: ${{ steps.plan.outputs.count > 0 }}
        with:
          script: |
            const fs = require('node:fs')
            const body = fs.readFileSync('comment.md', 'utf8')
            const marker = body.split('\n')[0]
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              })
              const existing = comments.find(c => c.body?.startsWith(marker))
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
                core.info(`已更新视觉对照评论 #${existing.id}`)
              }
              else if (process.env.HAS_COMPONENTS === 'true') {
                await github.rest.issues.createComment({ owner, repo, issue_number, body })
                core.info('已新建视觉对照评论')
              }
              else {
                core.info('没有要跑的组件，也没有旧评论，不发评论')
              }
            }
            catch (error) {
              core.warning(`写不了 PR 评论（${error.status ?? ''} ${error.message}），结果见运行摘要`)
            }
