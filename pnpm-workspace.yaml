    '@iconify-json/lucide': 1.2.147
    '@monaco-editor/loader': 1.7.0
    monaco-editor: 0.55.1
    postcss: 8.5.29
    sucrase: 3.35.1

    unocss: 66.10.5
    vitepress: 2.0.0-alpha.20
  language:
