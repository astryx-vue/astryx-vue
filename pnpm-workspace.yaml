catalogMode: strict
cleanupUnusedCatalogs: true
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
autoInstallPeers: false
strictPeerDependencies: true
shellEmulator: true

packages:
  - 'apps/*'
  - 'packages/*'

catalogs:
  build:
    '@vitejs/plugin-vue': 6.0.9
    tsdown: 0.23.0
    unplugin-vue: 8.0.0
    unrun: 0.3.1

    vite: 8.3.3
  deploy:
    wrangler: 4.149.0
  docs:
    '@fontsource/figtree': 5.3.0
    '@fontsource/fira-code': 5.3.0
    '@iconify-json/carbon': 1.2.28
    postcss: 8.5.29

    unocss: 66.10.5
    vitepress: 2.0.0-alpha.20
  language:
    '@types/node': 26.6.4

    '@typescript/native': npm:typescript@7.0.2
    typescript: npm:@typescript/typescript6@6.0.2
  linting:
    '@antfu/eslint-config': 9.5.1
    eslint: 10.12.0
    eslint-plugin-vuejs-accessibility: 2.6.0
    globals: 17.13.0

  runtime:
    '@internationalized/date': 3.12.4

  testing:
    '@vue/test-utils': 2.5.1
    happy-dom: 20.14.5
    vitest: 5.0.3

  vue:
    '@vue/compiler-dom': 3.5.43
    '@vue/compiler-sfc': 3.5.43
    '@vue/server-renderer': 3.5.43
    vue: 3.5.43
    vue-tsc: 3.3.12

allowBuilds:
  esbuild: set this to true or false
  workerd: set this to true or false
