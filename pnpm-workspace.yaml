catalogMode: strict
cleanupUnusedCatalogs: true
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
autoInstallPeers: false
strictPeerDependencies: true
shellEmulator: true

packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  workerd: true

catalogs:
  build:
    '@vitejs/plugin-vue': 6.0.9
    tsdown: 0.23.0
    unplugin-vue: 8.0.0
    unrun: 0.3.1

    vite: 8.3.3
  charts:
    '@types/d3-scale': 4.0.9
    '@types/d3-shape': 3.1.8
    d3-scale: 4.0.2
    d3-shape: 3.2.0
  deploy:
